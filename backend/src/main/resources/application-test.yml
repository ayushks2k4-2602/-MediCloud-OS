server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:saas_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

app:
  jwt:
    secret: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
    issuer: saas-platform-test
  tenant:
    header-name: X-Tenant-ID
    default-tenant-id: 00000000-0000-0000-0000-000000000001
  stripe:
    secret-key: sk_test_mock
    webhook-secret: whsec_mock
